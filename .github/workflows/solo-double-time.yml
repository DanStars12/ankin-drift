name: ANKIN DOUBLE TIME full timeline
on:
  pull_request:
    paths:
      - 'index.html'
      - 'v13-archive.js'
      - 'tests/v13-35-double-time.spec.mjs'
      - '.github/workflows/solo-double-time.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solo-clock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  full-timeline:
    name: DOUBLE TIME full AI timelines
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANKIN_DOUBLE_TIME_LONG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Compare real 15m and 30m schedules with fusion and rewards, 5 ships x 3 seeds
        run: npx playwright test tests/v13-35-double-time.spec.mjs --project=desktop --grep='full timeline'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: double-time-full-timeline
          path: test-results/
          retention-days: 14
