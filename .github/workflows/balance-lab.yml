name: ANKIN BALANCE LAB (manual)

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Repeated random seeds per ship (1-20)'
        required: true
        default: '5'
        type: string
      duration:
        description: 'Simulated seconds per short test (1-60)'
        required: true
        default: '10'
        type: string
      policy:
        description: 'AI ability policy for A/B comparison (v13.33 tactical vs legacy)'
        required: true
        default: tactical
        type: choice
        options: [tactical, legacy]
      fusion_policy:
        description: 'Full 30-minute fusion comparison: always / adaptive / never'
        required: true
        default: always
        type: choice
        options: [always, adaptive, never]
      mode:
        description: 'Run v13.29 DPS, v13.30 live AI, or expensive 30-minute clear-rate simulation'
        required: true
        default: baseline
        type: choice
        options: [baseline, live-ai, full-30m]

permissions:
  contents: read

jobs:
  balance:
    name: Balance measurements (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.mode == 'full-30m' && '["desktop"]' || '["desktop","mobile-390","mobile-320"]') }}
    env:
      ANKIN_BALANCE_SEEDS: ${{ inputs.seeds }}
      ANKIN_BALANCE_DURATION: ${{ inputs.duration }}
      ANKIN_AI_SEEDS: ${{ inputs.seeds }}
      ANKIN_AI_SECONDS: ${{ inputs.duration }}
      ANKIN_AI_POLICY: ${{ inputs.policy }}
      ANKIN_FUSION_POLICY: ${{ inputs.fusion_policy }}
      ANKIN_BALANCE_FULL: ${{ inputs.mode == 'full-30m' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate test limits
        run: |
          node -e "const n=Number(process.env.ANKIN_BALANCE_SEEDS),d=Number(process.env.ANKIN_BALANCE_DURATION);if(!Number.isInteger(n)||n<1||n>20||!Number.isFinite(d)||d<1||d>60)process.exit(1)"
      - run: npm ci
      - run: npx playwright install chromium
      - name: Collect v13.29 fixed-target data
        if: inputs.mode == 'baseline'
        run: npm run balance:lab -- --project=${{ matrix.project }}
      - name: Collect v13.33 tactical/legacy ability AI and survival
        if: inputs.mode == 'live-ai'
        run: npm run balance:ai -- --project=${{ matrix.project }}
      - name: Collect v13.30 true full-timeline AI outcomes (desktop only)
        if: inputs.mode == 'full-30m'
        run: npm run balance:ai -- --project=desktop --grep="optional true 30-minute"
      - name: Upload JSON and CSV measurement reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ankin-balance-${{ matrix.project }}
          path: |
            artifacts/balance-lab/
            test-results/
          if-no-files-found: warn
          retention-days: 30
