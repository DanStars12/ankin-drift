name: PHANTOM bounded balance investigation
on:
  push:
    branches: ['experiment/phantom-cleave-20261118']
permissions:
  contents: read
concurrency:
  group: phantom-investigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paired:
    name: PHANTOM fixture (${{ matrix.variant }}, ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [cleave, coverage, growth, coverage-growth]
        mode: [normal, challenge]
    env:
      ANKIN_ARSENAL_FULL: '1'
      ANKIN_ARSENAL_FULL_SEEDS: '10'
      ANKIN_ARSENAL_SHIP: phantom
      ANKIN_ARSENAL_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Prepare disposable fixture
        run: node scripts/companion-investigation.mjs ${{ matrix.variant }}
      - name: Measure real progression with unchanged AI
        run: npx playwright test tests/v13-36-arsenal.spec.mjs --project=desktop --grep='arsenal full progression'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phantom-fixture-${{ matrix.variant }}-${{ matrix.mode }}
          path: |
            artifacts/arsenal/
            test-results/
          retention-days: 14
