name: PHANTOM native render load
on:
  push:
    branches: ['experiment/phantom-native-load-20261118']
permissions:
  contents: read
concurrency:
  group: phantom-native-load-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-load:
    name: PHANTOM native load (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile-390, mobile-320]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: node scripts/companion-investigation.mjs baseline-growth
      - run: npx playwright test tests/phantom-load.spec.mjs --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phantom-native-load-${{ matrix.project }}
          path: test-results/
          retention-days: 14
