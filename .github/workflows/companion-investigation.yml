name: PHANTOM confirmation and unseen-seed validation
on:
  push:
    branches: ['experiment/phantom-cleave-20261118']
permissions:
  contents: read
concurrency:
  group: phantom-investigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paired:
    name: PHANTOM confirm (${{ matrix.variant }}, ${{ matrix.mode }}, ${{ matrix.cohort }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, baseline-growth, relic-defense]
        cohort: [original, holdout]
        mode: [normal, challenge]
    env:
      ANKIN_ARSENAL_FULL: '1'
      ANKIN_ARSENAL_FULL_SEEDS: '20'
      ANKIN_FULL_START_SEED: ${{ matrix.cohort == 'holdout' && '37' || '17' }}
      ANKIN_ARSENAL_SHIP: phantom
      ANKIN_ARSENAL_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Prepare disposable fixture
        run: node scripts/companion-investigation.mjs ${{ matrix.variant }}
      - name: Measure real progression with unchanged AI
        run: npx playwright test tests/v13-36-arsenal.spec.mjs --project=desktop --grep='arsenal full progression'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phantom-confirm-${{ matrix.variant }}-${{ matrix.mode }}-${{ matrix.cohort }}
          path: |
            artifacts/arsenal/
            test-results/
          retention-days: 14

  native-load:
    name: PHANTOM native load (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile-390, mobile-320]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: node scripts/companion-investigation.mjs baseline-growth
      - run: npx playwright test tests/phantom-load.spec.mjs --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phantom-native-load-${{ matrix.project }}
          path: test-results/
          retention-days: 14
