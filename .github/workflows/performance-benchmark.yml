name: ANKIN DRIFT performance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    name: Benchmark (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile-390]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Check out comparison baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: comparison-base
          persist-credentials: false
      - name: Profile baseline on the same runner
        if: github.event_name == 'pull_request'
        working-directory: comparison-base
        run: |
          cp ../tests/performance.spec.mjs tests/performance.spec.mjs
          cp ../tests/tactical-performance.spec.mjs tests/tactical-performance.spec.mjs
          npm ci
          ANKIN_PERF_BASELINE=1 npx playwright test tests/performance.spec.mjs tests/tactical-performance.spec.mjs --project=${{ matrix.project }} --repeat-each=3
      - name: Profile normal, dual and triple raid
        run: npx playwright test tests/performance.spec.mjs tests/tactical-performance.spec.mjs --project=${{ matrix.project }} --repeat-each=3
      - name: Compare shipped search and geometry kernels
        if: github.event_name == 'pull_request'
        run: node scripts/benchmark-hotpaths.mjs comparison-base/index.html
      - name: Upload per-scenario JSON and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.project }}
          path: |
            artifacts/hotpaths/
            playwright-report/
            test-results/
            comparison-base/test-results/
          if-no-files-found: warn
          retention-days: 14
