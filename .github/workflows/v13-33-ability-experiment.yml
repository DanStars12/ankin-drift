name: ANKIN v13.33 ability A/B experiment

on:
  push:
    branches: [dev/v13-33-ability-ai]

concurrency:
  group: v13-33-ability-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    name: 30m AI policy ${{ matrix.policy }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        policy: [legacy, tactical]
    env:
      ANKIN_AI_SEEDS: '5'
      ANKIN_AI_POLICY: ${{ matrix.policy }}
      ANKIN_BALANCE_FULL: '1'
      ANKIN_AI_SECONDS: '14'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run 5 ships x 5 seeds x full 30 minutes
        run: npm run balance:ai -- --project=desktop --grep="optional true 30-minute"
      - name: Upload A/B metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-33-full30m-${{ matrix.policy }}
          path: |
            artifacts/balance-lab/
            test-results/
          retention-days: 14
          if-no-files-found: warn
