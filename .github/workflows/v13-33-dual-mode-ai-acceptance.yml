name: ANKIN v13.33 separate 15m and 30m AI acceptance

on:
  pull_request:
    branches: [dev/v13-33-ability-ai]
    paths:
      - 'scripts/balance-ai-harness.mjs'
      - 'scripts/balance-report.mjs'
      - 'tests/v13-30-balance-ai.spec.mjs'
      - '.github/workflows/v13-33-dual-mode-ai-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dual-mode-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-mode:
    name: Full AI ${{ matrix.minutes }}m / ${{ matrix.fusion }} fusion / 5 ships / ${{ matrix.seeds }} seeds
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {minutes: '15', fusion: always, seeds: '3'}
          - {minutes: '15', fusion: never, seeds: '1'}
          - {minutes: '30', fusion: always, seeds: '3'}
          - {minutes: '30', fusion: never, seeds: '1'}
    env:
      ANKIN_AI_SEEDS: ${{ matrix.seeds }}
      ANKIN_AI_POLICY: tactical
      ANKIN_FUSION_POLICY: ${{ matrix.fusion }}
      ANKIN_BALANCE_FULL: ${{ matrix.minutes }}
      ANKIN_AI_SECONDS: '14'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Verify ${{ matrix.minutes }}m real in-game progression, all 5 machines
        run: npm run balance:ai -- --project=desktop --grep="optional real ${{ matrix.minutes }}-minute"
      - name: Upload independent mode reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-acceptance-full-${{ matrix.minutes }}m-${{ matrix.fusion }}
          path: |
            artifacts/balance-lab/
            test-results/
          retention-days: 14
          if-no-files-found: warn
