function skillById(id){return [...SKILLS,...POWERS,...LEGENDS,...UNIQUE_SKILLS,...RELICS].find(c=>c.id===id)}
function coloredName(id){const c=skillById(id);return c?`<span class="rarity-name ${c.rarity}">${c.name}</span>`:id}
function evolutionPeekLink(id){const r=FUSIONS.find(x=>x.id===id);return r?`<span class="skill-peek-trigger" data-evo-peek="${escHtml(id)}" tabindex="0" role="button" aria-label="${escHtml(r.name)}の進化レシピ詳細">${escHtml(r.name)} <span class="peek-icon">ⓘ</span></span>`:id}
function skillPeekLink(id){const c=skillById(id);if(!c)return coloredName(id);return `<span class="skill-peek-trigger rarity-name ${c.rarity}" role="button" tabindex="0" data-skill-peek="${escHtml(id)}" aria-label="${escHtml(c.name)}のスキル詳細を表示">${escHtml(c.name)}<span class="peek-icon" aria-hidden="true">ⓘ</span></span>`}
function choiceSynergyReady(c){return synergiesFor(c.id).some(a=>!game.synergies[a.id]&&a.need.some(id=>id!==c.id&&owned(id)))}
function choiceEvolutionReady(c){return fusionFor(c.id).some(r=>!game.fusions[r.id]&&owned(c.id===r.power?r.legend:r.power))}
function choiceElementCombinationReady(c){
 if(!game||!c||isSealedCard(c)||game.elementCombos.length>=2)return false;
 const element=elementFromCard(c),keys=ownedElementKeys();if(!element)return false;
 return keys.some(k=>k!==element)||(!keys.includes(element)&&keys.length>0);
}
function recipePartnerMarkup(id){const c=skillById(id);return `<span class="requirement ${owned(id)?'owned':'missing'}">${owned(id)?'✓ 所持':'＋ 未所持'} ${skillPeekLink(id)} <small>${c?.rarity==='unique'?'UNIQUE ANKIN':c?.rarity==='legendary'?'LEGENDARY':'ANKIN POWER'}</small></span>`}
function evolutionMarkup(c){const recipes=fusionFor(c.id);if(!recipes.length)return '';
 return recipes.map(a=>{const done=!!game.fusions[a.id],partner=c.id===a.power?a.legend:a.power,ready=owned(partner);return `<div class="evolve ${ready&&!done?'ready':''}"><div class="evo-title">${done?'✓ 進化済み':ready?'✦ 進化可能スキル！':'◈ 進化合成の組み合わせ'}：${a.icon} ${a.name}</div><div class="recipe-parts">${recipePartnerMarkup(a.power)}<span class="fusion-plus">＋</span>${recipePartnerMarkup(a.legend)}</div><div class="recipe-effect">${a.desc}</div>${ready&&!done?'<b>このカードで自動的に進化！</b>':''}</div>`}).join('')}
function synergyMarkup(c){return synergiesFor(c.id).filter(a=>!game.synergies[a.id]).sort((a,b)=>Number(owned(b.need.find(x=>x!==c.id)))-Number(owned(a.need.find(x=>x!==c.id)))).slice(0,3).map(a=>{const partner=a.need.find(x=>x!==c.id),ready=owned(partner);return `<div class="synergy-note ${ready?'combo-ready':''}"><div class="synergy-note-head"><b>${a.name}</b>${ready?'<span class="combo-ready-pill">✦ 今選ぶと完成！</span>':'<span>◇ シナジー候補</span>'}</div><div class="synergy-partner-row">相方：${skillPeekLink(partner)} <span class="${ready?'partner-owned':'partner-missing'}">${ready?'✓ 取得済み':'未取得'}</span></div><span class="synergy-effect-line">完成時の効果：${escHtml(a.desc)}</span></div>`}).join('')}
function cardsMarkup(){return choices.map((c,i)=>{const ready=choiceSynergyReady(c),evoReady=choiceEvolutionReady(c),elementReady=choiceElementCombinationReady(c),targets=choiceTargetMatches(c);return `<button class="choice ${c.rarity} ${ready?'synergy-ready-choice':''} ${evoReady?'evolution-ready-choice':''} ${targets.length?'target-matching':''}" data-choice="${i}"><div class="choice-head"><span class="choice-num">${i+1}</span><span class="rarity">${RARITY_NAMES[c.rarity]}</span>${evoReady?'<span class="evolution-ready-banner">◇ 進化合成可能！</span>':''}${elementReady?'<span class="element-ready-banner">◈ 属性合成可能！</span>':''}${ready?'<span class="synergy-ready-banner">✦ シナジー完成可能</span>':''}</div>${targets.length?`<span class="target-banner">✦ 目標進化の素材：${targets.map(t=>escHtml(t.name)).join(' / ')}</span>`:''}<span class="choice-icon">${c.icon}</span><div class="choice-name rarity-name ${c.rarity}">${c.name}${owned(c.id)?' <span class="stack-indicator">[強化]</span>':''}</div><div class="choice-attrs">${attrMarkup(c)}${elementReady?'<span class="attr attr-info attr-element-ready" data-attr-peek="属性合成可能！" tabindex="0" role="button">属性合成可能！ ⓘ</span>':''}</div><div class="choice-desc">${c.desc}</div>${evolutionMarkup(c)}${!['legendary','power','unique'].includes(c.rarity)?synergyMarkup(c):''}<span class="choice-pick">✓ タップして取得</span></button>`}).join('')}
function skillRow(c,n){const dormant=isSealedCard(c);return `<div class="owned-skill ${c.rarity} ${dormant?'rebirth-dormant':''}"><div class="owned-skill-top"><span class="rarity-name ${c.rarity}">${c.icon} ${c.name}</span>${n>1?'<b>×'+n+'</b>':''}${dormant?'<b class="rebirth-rest">✦ 共鳴素材・効果休眠</b>':''}</div><div class="owned-tags">${attrMarkup(c)}</div><div class="skill-details">${c.desc}</div></div>`;}
function listBuild(){const part=(obj,defs)=>Object.entries(obj).map(([id,n])=>{const c=defs.find(x=>x.id===id);return c?skillRow(c,n):''}).join('');return{skills:part(game.skills,SKILLS),powers:part(game.powers,POWERS),legends:part(game.legends,LEGENDS),uniques:part(game.uniques,UNIQUE_SKILLS),relics:part(game.relics,RELICS)}}
function inventoryMarkup(b){let html='';for(const [kind,title,body] of [['relic','✦ RELIC / WEAPON MOD',b.relics],['unique','✺ UNIQUE ANKIN',b.uniques],['legendary','★ LEGENDARY',b.legends],['power','◈ ANKIN POWER',b.powers]])html+=`<section class="lab-section ${kind}"><h3>${title}</h3><div class="inventory-grid">${body||'<div class="empty-inventory">まだ取得していません</div>'}</div></section>`;
 if(game.elementCombos.length){html+=`<section class="lab-section"><h3 style="color:#ffd68c">✦ 属性融合 · ELEMENTAL CROSS</h3><div class="inventory-grid">${game.elementCombos.map(x=>{const r=ELEMENT_FUSION_RECIPES.find(v=>v.main===x.main&&v.sub===x.sub),color=FUSION_PALETTES[x.main][x.sub];return `<div class="owned-skill rebirth-card" style="--fusion-color:${color};border-color:${color};background:#18213d"><div class="rarity-name" style="color:${color}">${r.icon} ${r.name}</div><div class="skill-details">主属性：${ELEMENTS[x.main].name} / 共鳴：${ELEMENTS[x.sub].name}<br>カード保持 ${x.cards||0}枚・共鳴出力 ${(x.resonance||0).toFixed(1)}<br>${r.desc}</div></div>`}).join('')}</div></section>`}
 for(const [kind,title] of [['epic','EPIC'],['rare','RARE'],['uncommon','UNCOMMON'],['common','COMMON']]){const rows=Object.entries(game.skills).map(([id,n])=>{const c=skillById(id);return c?.rarity===kind?skillRow(c,n):''}).join('');if(rows)html+=`<section class="lab-section ${kind}"><h3>${title}</h3><div class="inventory-grid">${rows}</div></section>`}return html}
function recipeBuild(){const recipes=activeFusions().filter(a=>{const done=!!game.fusions[a.id],near=owned(a.power)||owned(a.legend);return labRecipeFilters.evolution==='all'||(labRecipeFilters.evolution==='done'?done:labRecipeFilters.evolution==='near'?!done&&near:!done&&!near)}).sort((a,b)=>((game.fusions[b.id]?3:owned(b.power)&&owned(b.legend)?2:owned(b.power)||owned(b.legend)?1:0)-(game.fusions[a.id]?3:owned(a.power)&&owned(a.legend)?2:owned(a.power)||owned(a.legend)?1:0)));return recipes.map(a=>{const hasP=owned(a.power),hasL=owned(a.legend),done=!!game.fusions[a.id];const missing=[a.power,a.legend].filter(id=>!owned(id));return `<article class="lab-recipe ${done?'done':hasP&&hasL?'ready':hasP||hasL?'partial':''}"><div class="lab-recipe-head"><strong>${a.icon} ${a.name}</strong><span>${done?'✓ 進化完了':hasP&&hasL?'✦ 合成可能':hasP||hasL?'あと1種類':'未完成'}</span></div><div class="recipe-parts">${recipePartnerMarkup(a.power)}<span class="fusion-plus">＋</span>${recipePartnerMarkup(a.legend)}</div>${!done&&missing.length===1?`<div class="recipe-missing">次に必要：${coloredName(missing[0])}</div>`:''}<div class="recipe-effect">進化効果：${a.desc}</div></article>`}).join('')||'<p class="lab-empty">この条件の進化レシピはありません。</p>'}
function synergyBuild(){const recipes=activeSynergies().filter(a=>{const done=!!game.synergies[a.id],near=a.need.some(owned);return labRecipeFilters.synergy==='all'||(labRecipeFilters.synergy==='done'?done:labRecipeFilters.synergy==='near'?!done&&near:!done&&!near)}).sort((a,b)=>((game.synergies[b.id]?2:b.need.some(owned)?1:0)-(game.synergies[a.id]?2:a.need.some(owned)?1:0)));return recipes.map(a=>{const done=!!game.synergies[a.id],missing=a.need.filter(id=>!owned(id));return `<article class="lab-recipe synergy-recipe ${done?'done':missing.length===1?'partial':''}"><div class="lab-recipe-head"><strong class="synergy-gradient">✧ ${a.name}</strong><span>${done?'✓ 発動中':missing.length===1?'✦ 相方あと1つ':'未完成'}</span></div><div class="recipe-parts">${a.need.map(id=>`<span class="requirement ${owned(id)?'owned':'missing'}">${skillPeekLink(id)}</span>`).join('<span class="fusion-plus">＋</span>')}</div>${!done&&missing.length===1?`<div class="recipe-missing">あと1つで完成：${skillPeekLink(missing[0])}　（名前をタップして効果を確認）</div>`:''}<div class="recipe-effect">発動効果：${a.desc}</div></article>`}).join('')||'<p class="lab-empty">この条件のシナジーはありません。</p>'}
const ALL_SKILL_DEFS=()=>[...SKILLS,...POWERS,...LEGENDS,...UNIQUE_SKILLS,...RELICS];
const escHtml=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function atlasList(){const q=atlasQuery.toLocaleLowerCase('ja'),filtered=ALL_SKILL_DEFS().filter(c=>(atlasRarity==='all'||c.rarity===atlasRarity)&&(atlasAttr==='all'||c.tags.includes(atlasAttr))&&[c.name,c.desc,c.rarity,...c.tags,SHIPS[c.shipOnly]?.jp||''].join(' ').toLocaleLowerCase('ja').includes(q));
 const order={common:0,uncommon:1,rare:2,epic:3,power:4,legendary:5,unique:6,relic:7};filtered.sort((a,b)=>order[a.rarity]-order[b.rarity]||a.name.localeCompare(b.name,'ja'));
 const items=filtered.map(c=>{const have=game.skills[c.id]||game.powers[c.id]||game.legends[c.id]||game.uniques[c.id]||game.relics[c.id]||0;const fits=fitsShip(c),claimed=rewardAlreadyTaken(c);const evol=FUSIONS.filter(a=>a.power===c.id||a.legend===c.id).map(a=>`${a.name}（相方：${cName(a.power===c.id?a.legend:a.power)}）`);const syn=SYNERGIES.filter(a=>a.need.includes(c.id));const synActive=syn.filter(a=>game.synergies[a.id]&&!a.need.some(x=>isSealedCard(skillById(x)))).length;const synReady=syn.filter(a=>!game.synergies[a.id]&&a.need.filter(x=>x!==c.id).every(owned)&&(!a.shipOnly||a.shipOnly===player.shipType)).length;return `<article class="atlas-card ${c.rarity} atlas-interactive" role="button" tabindex="0" data-atlas-card="${escHtml(c.id)}" aria-label="${escHtml(c.name)}の詳細を開く"><div class="atlas-head"><span class="rarity-name ${c.rarity}">${c.icon} ${escHtml(c.name)}</span><span class="atlas-rank ${c.rarity}">${RARITY_NAMES[c.rarity]}</span></div><div>${attrMarkup(c)}</div><div class="atlas-desc">${escHtml(c.desc)}</div><div class="atlas-meta">${c.shipOnly?`専用機体：${SHIPS[c.shipOnly].jp}`:c.excludeShips?.length?`使用不可：${c.excludeShips.map(id=>SHIPS[id].jp).join('・')}`:'全機体で使用可能'}　${have?`<b class="atlas-owned">✓ 取得済み ×${have}</b>`:claimed?'<b class="atlas-owned">✓ 取得済み（融合で消費）</b>':'未取得'} ${!fits?' · 現在の機体では選択不可':''}</div><div class="atlas-open-hint">ⓘ カードをクリック・タップで詳細表示</div>${evol.length?`<div class="atlas-assoc fusion">進化合成：${evol.map(escHtml).join(' ／ ')}</div>`:''}${syn.length?`<div class="atlas-assoc synergy"><b class="synergy-gradient">✧ 関連シナジー ${syn.length}件</b> ${synActive?`<span class="atlas-syn-ready">✓ 発動中 ${synActive}件</span>`:''} ${synReady?`<span class="atlas-syn-ready">✦ 相方所持 ${synReady}件</span>`:''}<div class="atlas-syn-hint">${syn.slice(0,2).map(a=>escHtml(a.name)).join(' ／ ')}${syn.length>2?' ほか':''} — クリックで相方・発動効果・所持状況を確認</div></div>`:''}</article>`}).join('');return `<p class="atlas-count">表示 ${filtered.length} / 全${ALL_SKILL_DEFS().length}種類　｜　現在の機体：${SHIPS[player.shipType].jp}</p><div class="atlas-grid">${items||'<p class="atlas-empty">該当するスキルがありません。検索条件を変更してください。</p>'}</div>`}
function atlasMarkup(){const attrs=[...new Set(ALL_SKILL_DEFS().flatMap(c=>c.tags))].sort((a,b)=>a.localeCompare(b,'ja'));return `<div class="atlas-controls"><label>名称・効果を検索<input id="atlasSearch" type="search" placeholder="例：炎 / 貫通 / 壁 / レーザー" value="${escHtml(atlasQuery)}"></label><label>レアリティ<select id="atlasRarity">${[['all','すべて'],...Object.entries(RARITY_NAMES).map(([k,v])=>[k,v])].map(([key,title])=>`<option value="${key}" ${atlasRarity===key?'selected':''}>${title}</option>`).join('')}</select></label><label>属性・種類<select id="atlasAttr">${[['all','すべて'],...attrs.map(x=>[x,x])].map(([key,title])=>`<option value="${escHtml(key)}" ${atlasAttr===key?'selected':''}>${escHtml(title)}</option>`).join('')}</select></label></div><div id="atlasResults">${atlasList()}</div>`}

// v10.1 combat balance: slightly lower numeric skill gains, preserving discrete unlocks,
// projectile counts, one-off healing, attribute seals and upgrade requirements.
// Applied identically during acquisition and build reconstruction.
const UPGRADE_GAIN_SCALE={common:.92,uncommon:.92,rare:.92,epic:.92,power:.94,legendary:.94,unique:.96,relic:.97,synergy:.94,fusion:.95,element:.95};
const SCALE_FIELDS=new Set(['dmg','novaDamage','novaRadius','spd','maxHp','shieldMax','shieldRecharge',
 'regen','crit','critMult','chainDamage','explosion','lifeSteal','slowChance','burnChance','thermal',
 'magmaRadius','magmaDps','windRadius','windStrength','windDps','rockDamage','rockSize',
 'chargeRate','chargeScale','chargeSize','chargeBlast','laserBonus','laserScale','laserWidth',
 'laserReach','iceAttackSlow','freezeChance','freezeDuration','iceBurst',
 'shotSpeed','rate','droneBoost','bossBane','echoShots','novaGain','killBurst',
 'killCharge','staticField','slowField']);
function applyBalancedUpgrade(p,apply,rarity='common'){
 const ratio=UPGRADE_GAIN_SCALE[rarity]??.94,before={};
 for(const k of SCALE_FIELDS)if(typeof p[k]==='number'&&Number.isFinite(p[k]))before[k]=p[k];
 const oldHp=p.hp,oldShield=p.shield;
 apply(p);
 for(const [k,v] of Object.entries(before)){
   const after=p[k];if(typeof after!=='number'||!Number.isFinite(after)||after===v)continue;
   const delta=after-v;
   // These fields are naturally integer stack counters and must not become fractional.
   if(['staticField','killBurst','killCharge'].includes(k))continue;
   p[k]=v+delta*ratio;
 }
 // Match instant current-HP and shield increments to their slightly smaller new maxima.
 // Full-heal effects still restore exactly to the recalculated maximum.
 if(before.maxHp!==undefined&&p.maxHp!==before.maxHp){
  const originalDelta=(p.maxHp-before.maxHp)/ratio, hpGain=p.hp-oldHp;
  if(Math.abs(hpGain-originalDelta)<.001)p.hp=oldHp+(p.maxHp-before.maxHp);
  else if(p.hp>=before.maxHp+originalDelta-.001)p.hp=p.maxHp;
  p.hp=Math.min(p.hp,p.maxHp);
 }
 if(before.shieldMax!==undefined&&p.shieldMax!==before.shieldMax){
  const originalDelta=(p.shieldMax-before.shieldMax)/ratio,shieldGain=p.shield-oldShield;
  if(Math.abs(shieldGain-originalDelta)<.001)p.shield=oldShield+(p.shieldMax-before.shieldMax);
  p.shield=Math.min(p.shield,p.shieldMax);
 }
 return p;
}
