function playMusic(){if(!musicOn||mode!=='playing'||!setupAudio()||audio.state!=='running')return;const now=audio.currentTime;if(nextMusicBeat<now-.5){nextMusicBeat=now+.035;musicStep=0}if(nextMusicBeat===0)nextMusicBeat=now+.05;const halfBeat=60/(132+Math.min(25,Math.floor((game?.total||0)/240)*3))/2,root=MUSIC_ROOT*(boss?Math.pow(2,-2/12):1);let limit=0;while(nextMusicBeat<now+.18&&limit++<4){const step=musicStep++,bar=Math.floor(step/16),unit=step%16;
 if(unit%4===0){synth(root*(unit===12?Math.pow(2,5/12):1),.30,'triangle',.12,nextMusicBeat,'music');synth(root/2,.2,'sine',.09,nextMusicBeat,'music',root/3)}
 if(unit%4===2)synth(265,.048,'triangle',.04,nextMusicBeat,'music',80);
 if(unit%2===1)synth(1000,.025,'square',.012,nextMusicBeat,'music',780);
 if([0,3,5,7,8,11,13,15].includes(unit)){const idx=(unit*3+bar*5)%MUSIC_SCALE.length;const semitone=MUSIC_SCALE[idx];synth(root*4*Math.pow(2,semitone/12),.13+(unit===15?.12:0),'triangle',.044,nextMusicBeat,'music')}
 if(unit===0||unit===8)synth(root*2*Math.pow(2,(bar%4===3?5:bar%4===2?7:0)/12),.75,'sine',.025,nextMusicBeat,'music');
 nextMusicBeat+=halfBeat}}

function v13CollectAwards(){
 const gained=AnkinArchive.takeUnlocks();
 const firstClear=gained.find(a=>a.id==='first_clear');
 if(firstClear){
  // First victory's rainbow trophy must interrupt lesser popups on the boss-clear frame.
  if(achievementCurrent)achievementQueue.unshift(achievementCurrent);
  achievementCurrent=firstClear;achievementExpires=performance.now()+6200;
 }
 achievementQueue.push(...gained.filter(a=>a!==firstClear));
 achievementQueue.sort((a,b)=>Number(b.tier==='rainbow')-Number(a.tier==='rainbow'));
 if(!achievementCurrent&&achievementQueue.length){
  achievementCurrent=achievementQueue.shift();achievementExpires=performance.now()+5200;
 }
 if(firstClear||achievementCurrent)v13RenderAward();
 return gained;
}

}

// A choice accepts only a NEW tap begun on its card after the panel becomes visible.
// Do not count other fingers: the joystick can remain down and some browsers retarget
// pointerup after the choice DOM is replaced (leaving a stale global touch count).
let choiceOpenedAt=0;
const choiceTouchArms=new Map();
const CHOICE_TAP_GUARD_MS=260;
// Clear abandoned gestures on cancellation, tab switches, or a reset.
document.addEventListener('pointercancel',ev=>choiceTouchArms.delete(ev.pointerId),true);
window.addEventListener('blur',()=>choiceTouchArms.clear());
function canStartChoiceTouch(ev){
  return mode==='choice' && (ev.pointerType==='touch'||ev.pointerType==='pen')
    && performance.now()-choiceOpenedAt>=CHOICE_TAP_GUARD_MS;
}
function bindSafeChoice(el){
  const index=Number(el.dataset.choice);
  el.addEventListener('pointerdown',ev=>{
    if(!canStartChoiceTouch(ev))return;
    // An old joystick or DASH touch cannot become an upgrade tap: only a fresh
    // pointerdown on THIS new card arms the confirmation.
    choiceTouchArms.set(ev.pointerId,{index,x:ev.clientX,y:ev.clientY,element:el});
  });
  el.addEventListener('pointerup',ev=>{
    if(ev.pointerType!=='touch'&&ev.pointerType!=='pen')return;
    const arm=choiceTouchArms.get(ev.pointerId);
    choiceTouchArms.delete(ev.pointerId); // clear BEFORE choose() redraws the panel
    if(!arm||arm.element!==el||mode!=='choice'||
       performance.now()-choiceOpenedAt<CHOICE_TAP_GUARD_MS)return;
    if(Math.hypot(ev.clientX-arm.x,ev.clientY-arm.y)>19)return; // scrolling != selecting
    ev.preventDefault();ev.stopPropagation();choose(arm.index);
  });
  el.addEventListener('pointercancel',ev=>choiceTouchArms.delete(ev.pointerId));
  el.addEventListener('click',ev=>{
    // Touch is handled once on pointerup; its synthetic click must NEVER
    // purchase the next level's card after an immediate overlay redraw.
    if(ev.pointerType==='touch'||ev.pointerType==='pen'||ev.sourceCapabilities?.firesTouchEvents){
      ev.preventDefault();return;
    }
    if(mode==='choice')choose(index); // PC mouse and keyboard / accessibility
  });
}

 if(known[tag])return known[tag];

function skillById(id){return [...SKILLS,...POWERS,...LEGENDS,...UNIQUE_SKILLS,...RELICS].find(c=>c.id===id)}
function coloredName(id){const c=skillById(id);return c?`<span class="rarity-name ${c.rarity}">${c.name}</span>`:id}
function evolutionPeekLink(id){const r=FUSIONS.find(x=>x.id===id);return r?`<span class="skill-peek-trigger" data-evo-peek="${escHtml(id)}" tabindex="0" role="button" aria-label="${escHtml(r.name)}の進化レシピ詳細">${escHtml(r.name)} <span class="peek-icon">ⓘ</span></span>`:id}
function skillPeekLink(id){const c=skillById(id);if(!c)return coloredName(id);return `<span class="skill-peek-trigger rarity-name ${c.rarity}" role="button" tabindex="0" data-skill-peek="${escHtml(id)}" aria-label="${escHtml(c.name)}のスキル詳細を表示">${escHtml(c.name)}<span class="peek-icon" aria-hidden="true">ⓘ</span></span>`}
function choiceSynergyReady(c){return synergiesFor(c.id).some(a=>!game.synergies[a.id]&&a.need.some(id=>id!==c.id&&owned(id)))}
function choiceEvolutionReady(c){return fusionFor(c.id).some(r=>!game.fusions[r.id]&&owned(c.id===r.power?r.legend:r.power))}
// All elemental choices already show the always-valid 属性融合素材 tag;
 // no level-up banner should repeat the same 'fusion available' message.
function recipePartnerMarkup(id){const c=skillById(id);return `<span class="requirement ${owned(id)?'owned':'missing'}">${owned(id)?'✓ 所持':'＋ 未所持'} ${skillPeekLink(id)} <small>${c?.rarity==='unique'?'UNIQUE ANKIN':c?.rarity==='legendary'?'LEGENDARY':'ANKIN POWER'}</small></span>`}
function evolutionMarkup(c){const recipes=fusionFor(c.id);if(!recipes.length)return '';
 return recipes.map(a=>{const done=!!game.fusions[a.id],partner=c.id===a.power?a.legend:a.power,ready=owned(partner);return `<div class="evolve ${ready&&!done?'ready':''}"><div class="evo-title">${done?'✓ 進化済み':ready?'✦ 進化可能スキル！':'◈ 進化合成の組み合わせ'}：${a.icon} ${a.name}</div><div class="recipe-parts">${recipePartnerMarkup(a.power)}<span class="fusion-plus">＋</span>${recipePartnerMarkup(a.legend)}</div><div class="recipe-effect">${a.desc}</div>${ready&&!done?'<b>このカードで自動的に進化！</b>':''}</div>`}).join('')}
function synergyMarkup(c){return synergiesFor(c.id).filter(a=>!game.synergies[a.id]).sort((a,b)=>Number(owned(b.need.find(x=>x!==c.id)))-Number(owned(a.need.find(x=>x!==c.id)))).slice(0,3).map(a=>{const partner=a.need.find(x=>x!==c.id),ready=owned(partner);return `<div class="synergy-note ${ready?'combo-ready':''}"><div class="synergy-note-head"><b>${a.name}</b>${ready?'<span class="combo-ready-pill">✦ 今選ぶと完成！</span>':'<span>◇ シナジー候補</span>'}</div><div class="synergy-partner-row">相方：${skillPeekLink(partner)} <span class="${ready?'partner-owned':'partner-missing'}">${ready?'✓ 取得済み':'未取得'}</span></div><span class="synergy-effect-line">完成時の効果：${escHtml(a.desc)}</span></div>`}).join('')}
function cardsMarkup(){return choices.map((c,i)=>{const ready=choiceSynergyReady(c),evoReady=choiceEvolutionReady(c),targets=choiceTargetMatches(c);return `<button class="choice ${c.rarity} ${ready?'synergy-ready-choice':''} ${evoReady?'evolution-ready-choice':''} ${targets.length?'target-matching':''}" data-choice="${i}"><div class="choice-head"><span class="choice-num">${i+1}</span><span class="rarity">${RARITY_NAMES[c.rarity]}</span>${evoReady?'<span class="evolution-ready-banner">◇ 進化合成可能！</span>':''}${ready?'<span class="synergy-ready-banner">✦ シナジー完成可能</span>':''}</div>${targets.length?`<span class="target-banner">✦ 目標進化の素材：${targets.map(t=>escHtml(t.name)).join(' / ')}</span>`:''}<span class="choice-icon">${c.icon}</span><div class="choice-name rarity-name ${c.rarity}">${c.name}${owned(c.id)?' <span class="stack-indicator">[強化]</span>':''}</div><div class="choice-attrs">${attrMarkup(c)}</div><div class="choice-desc">${c.desc}</div>${evolutionMarkup(c)}${!['legendary','power','unique'].includes(c.rarity)?synergyMarkup(c):''}<span class="choice-pick">✓ タップして取得</span></button>`}).join('')}
function skillRow(c,n){const dormant=isSealedCard(c);return `<div class="owned-skill ${c.rarity} ${dormant?'rebirth-dormant':''}"><div class="owned-skill-top"><span class="rarity-name ${c.rarity}">${c.icon} ${c.name}</span>${n>1?'<b>×'+n+'</b>':''}${dormant?'<b class="rebirth-rest">✦ 属性効果喪失・共鳴素材として記録</b>':''}</div><div class="owned-tags">${attrMarkup(c)}</div><div class="skill-details">${c.desc}</div></div>`;}
function listBuild(){const part=(obj,defs)=>Object.entries(obj).map(([id,n])=>{const c=defs.find(x=>x.id===id);return c?skillRow(c,n):''}).join('');return{skills:part(game.skills,SKILLS),powers:part(game.powers,POWERS),legends:part(game.legends,LEGENDS),uniques:part(game.uniques,UNIQUE_SKILLS),relics:part(game.relics,RELICS)}}
function inventoryMarkup(b){let html='';for(const [kind,title,body] of [['relic','✦ RELIC / WEAPON MOD',b.relics],['unique','✺ UNIQUE ANKIN',b.uniques],['legendary','★ LEGENDARY',b.legends],['power','◈ ANKIN POWER',b.powers]])html+=`<section class="lab-section ${kind}"><h3>${title}</h3><div class="inventory-grid">${body||'<div class="empty-inventory">まだ取得していません</div>'}</div></section>`;
 if(game.elementCombos.length){html+=`<section class="lab-section"><h3 style="color:#ffd68c">✦ 属性融合 · ELEMENTAL CROSS</h3><div class="inventory-grid">${game.elementCombos.map(x=>{const r=ELEMENT_FUSION_RECIPES.find(v=>v.main===x.main&&v.sub===x.sub),color=FUSION_PALETTES[x.main][x.sub];return `<div class="owned-skill rebirth-card" style="--fusion-color:${color};border-color:${color};background:#18213d"><div class="rarity-name" style="color:${color}">${r.icon} ${r.name}</div><div class="skill-details">主属性：${ELEMENTS[x.main].name} / 共鳴：${ELEMENTS[x.sub].name}<br>カード保持 ${x.cards||0}枚・共鳴出力 ${(x.resonance||0).toFixed(1)}<br>${r.desc}</div></div>`}).join('')}</div></section>`}
 for(const [kind,title] of [['epic','EPIC'],['rare','RARE'],['uncommon','UNCOMMON'],['common','COMMON']]){const rows=Object.entries(game.skills).map(([id,n])=>{const c=skillById(id);return c?.rarity===kind?skillRow(c,n):''}).join('');if(rows)html+=`<section class="lab-section ${kind}"><h3>${title}</h3><div class="inventory-grid">${rows}</div></section>`}return html}
function recipeBuild(){const recipes=activeFusions().filter(a=>{const done=!!game.fusions[a.id],near=owned(a.power)||owned(a.legend);return labRecipeFilters.evolution==='all'||(labRecipeFilters.evolution==='done'?done:labRecipeFilters.evolution==='near'?!done&&near:!done&&!near)}).sort((a,b)=>((game.fusions[b.id]?3:owned(b.power)&&owned(b.legend)?2:owned(b.power)||owned(b.legend)?1:0)-(game.fusions[a.id]?3:owned(a.power)&&owned(a.legend)?2:owned(a.power)||owned(a.legend)?1:0)));return recipes.map(a=>{const hasP=owned(a.power),hasL=owned(a.legend),done=!!game.fusions[a.id];const missing=[a.power,a.legend].filter(id=>!owned(id));return `<article class="lab-recipe ${done?'done':hasP&&hasL?'ready':hasP||hasL?'partial':''}"><div class="lab-recipe-head"><strong>${a.icon} ${a.name}</strong><span>${done?'✓ 進化完了':hasP&&hasL?'✦ 合成可能':hasP||hasL?'あと1種類':'未完成'}</span></div><div class="recipe-parts">${recipePartnerMarkup(a.power)}<span class="fusion-plus">＋</span>${recipePartnerMarkup(a.legend)}</div>${!done&&missing.length===1?`<div class="recipe-missing">次に必要：${coloredName(missing[0])}</div>`:''}<div class="recipe-effect">進化効果：${a.desc}</div></article>`}).join('')||'<p class="lab-empty">この条件の進化レシピはありません。</p>'}

  if(Math.abs(shieldGain-originalDelta)<.001)p.shield=oldShield+(p.shieldMax-before.shieldMax);
  p.shield=Math.min(p.shield,p.shieldMax);
 }
 return p;
}

    c=fusionCandidates[Math.floor(Math.random()*fusionCandidates.length)];

   }
   const completed=possible.filter(c=>synergiesFor(c.id).some(a=>!game.synergies[a.id]&&a.need.some(id=>id!==c.id&&owned(id))));

   const completedDiverse=completed.filter(c=>diverse.includes(c)),poolForRarity=same.filter(c=>diverse.includes(c));
   const weighted=Math.random()<.19&&completedDiverse.length?completedDiverse:(poolForRarity.length?poolForRarity:diverse);

  }else{

   const weighted=(i===0&&ready.length)||Math.random()<.75&&ready.length?ready:possible;

  }
  options.push(c);used.add(c.id);
 }
 // Do not soft-lock when all once-per-run boss rewards have been claimed.
 if(['normal','minor','major','unique'].includes(kind)&&options.length<desired){
